<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - Video Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; margin:0; padding:0; }
        .player-container { max-width: 1100px; margin: 40px auto; padding: 20px; text-align: center; }
        .title { font-size: 26px; margin: 20px 0; line-height: 1.3; }
        #thumb { width: 100%; max-width: 900px; border-radius: 16px; margin-bottom: 20px; }
        #bigPlayBtn { 
            font-size: 52px; 
            padding: 25px 90px; 
            background: linear-gradient(45deg, #ff0066, #ff9900); 
            color: white; 
            border: none; 
            border-radius: 60px; 
            cursor: pointer; 
            margin: 30px 0; 
            box-shadow: 0 10px 30px rgba(255,0,100,0.4);
        }
        #bigPlayBtn:hover { transform: scale(1.08); }
        video { width: 100%; max-width: 900px; display: none; border-radius: 16px; }
    </style>
</head>
<body>
    <div class="player-container">
        <h2 class="title" id="videoTitle">Loading video...</h2>
        <img id="thumb" src="" alt="thumbnail">
        <button id="bigPlayBtn">▶ PLAY VIDEO</button>
        <video id="mainVideo" controls autoplay></video>
    </div>

    <script>
        const ADSTERRA_LINK = "https://www.effectivecpmnetwork.com/uijre7dczs?key=486378b24f170bad582f7df9606ad732";
        const API_BASE = "https://xhamster-video-proxy.onrender.com";

        const urlParams = new URLSearchParams(window.location.search);
        const videoPageUrl = urlParams.get('url');

        let clickCount = 0;
        let videoData = null;

        async function loadVideoData() {
            if (!videoPageUrl) return;
            try {
                const res = await fetch(`${API_BASE}/api/video?url=${encodeURIComponent(videoPageUrl)}`);
                videoData = await res.json();

                if (videoData.success) {
                    document.getElementById('videoTitle').textContent = videoData.title;
                    document.getElementById('thumb').src = videoData.thumbnail || 'https://via.placeholder.com/900x500?text=Video';
                }
            } catch(e) {}
        }

        document.getElementById('bigPlayBtn').addEventListener('click', function() {
            clickCount++;
            
            if (clickCount === 1) {
                this.textContent = "Redirecting to Ad...";
                setTimeout(() => {
                    window.location.href = ADSTERRA_LINK;
                }, 600);
            } 
            else if (clickCount === 2 && videoData) {
                this.style.display = 'none';
                document.getElementById('thumb').style.display = 'none';
                
                const videoEl = document.getElementById('mainVideo');
                if (videoData.directVideoUrl) {
                    videoEl.src = videoData.directVideoUrl;
                } else {
                    videoEl.src = videoPageUrl; // fallback
                }
                videoEl.style.display = 'block';
                videoEl.play();
            }
        });

        loadVideoData();
    </script>
</body>
</html>
