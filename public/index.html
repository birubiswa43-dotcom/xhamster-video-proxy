<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 0; }
        header { background: #1a1a1a; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: #1f1f1f; border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .video-card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        .video-card img { width: 100%; height: 170px; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-info h3 { margin: 0 0 8px 0; font-size: 15px; line-height: 1.3; }
        .duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .card-wrapper { position: relative; }
    </style>
</head>
<body>
    <header>
        <h1>🔥 Video Hub</h1>
        <p>Pehli Click = Adsterra | Dusri Click = Video</p>
    </header>

    <div class="container">
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script>
        const API_BASE = "https://xhamster-video-proxy.onrender.com";

        async function loadVideos() {
            try {
                const res = await fetch(`${API_BASE}/api/videos`);
                const data = await res.json();
                
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';

                data.videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="card-wrapper">
                            <img src="${video.thumbnail}" alt="${video.title}">
                            <span class="duration">${video.duration}</span>
                        </div>
                        <div class="video-info">
                            <h3>${video.title}</h3>
                        </div>
                    `;
                    card.onclick = () => {
                        window.location.href = `player.html?url=${encodeURIComponent(video.videoPageUrl)}`;
                    };
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('videoGrid').innerHTML = `<p style="color:red;text-align:center;">Error loading videos.<br>Refresh karo.</p>`;
            }
        }

        window.onload = loadVideos;
    </script>
</body>
</html>
