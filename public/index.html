<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - Video Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #000; 
            color: #fff; 
            margin:0; 
            padding:0; 
            text-align: center;
        }
        .player-container { 
            max-width: 1100px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        .title { 
            font-size: 26px; 
            margin: 20px 0; 
            line-height: 1.3; 
        }
        #thumb { 
            width: 100%; 
            max-width: 900px; 
            border-radius: 16px; 
            margin-bottom: 25px; 
        }
        #bigPlayBtn { 
            font-size: 55px; 
            padding: 28px 100px; 
            background: linear-gradient(45deg, #ff0066, #ff8800); 
            color: white; 
            border: none; 
            border-radius: 60px; 
            cursor: pointer; 
            margin: 30px 0; 
            box-shadow: 0 15px 35px rgba(255,50,100,0.5);
            transition: all 0.3s;
        }
        #bigPlayBtn:hover { transform: scale(1.1); }
        .status { color: #ffcc00; font-size: 18px; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="player-container">
        <h2 class="title" id="videoTitle">Loading video...</h2>
        <img id="thumb" src="" alt="thumbnail">
        <button id="bigPlayBtn">▶ PLAY VIDEO</button>
        <p class="status" id="status"></p>
    </div>

    <script>
        const ADSTERRA_LINK = "https://www.effectivecpmnetwork.com/uijre7dczs?key=486378b24f170bad582f7df9606ad732";
        const API_BASE = "https://xhamster-video-proxy.onrender.com";

        const urlParams = new URLSearchParams(window.location.search);
        const videoPageUrl = urlParams.get('url');

        let clickCount = 0;
        let videoData = null;

        async function loadVideoData() {
            if (!videoPageUrl) {
                document.getElementById('videoTitle').textContent = "Error: Video not found";
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/video?url=${encodeURIComponent(videoPageUrl)}`);
                videoData = await res.json();

                if (videoData.success) {
                    document.getElementById('videoTitle').textContent = videoData.title;
                    document.getElementById('thumb').src = videoData.thumbnail || 'https://via.placeholder.com/900x500?text=Video';
                }
            } catch(e) {
                document.getElementById('videoTitle').textContent = "Failed to load details";
            }
        }

        document.getElementById('bigPlayBtn').addEventListener('click', function() {
            clickCount++;
            
            if (clickCount === 1) {
                this.textContent = "⏳ Redirecting to Ad...";
                document.getElementById('status').textContent = "Adsterra pe ja rahe hain...";
                
                setTimeout(() => {
                    window.location.href = ADSTERRA_LINK;
                }, 800);
            } 
            else if (clickCount === 2) {
                this.textContent = "Opening Original Video...";
                document.getElementById('status').innerHTML = "Xhamster pe redirect ho raha hai...";
                
                // Second click pe original xhamster page pe bhej do
                setTimeout(() => {
                    window.location.href = videoPageUrl;
                }, 1000);
            }
        });

        // Load video details
        loadVideoData();
    </script>
</body>
</html>
