<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background: linear-gradient(135deg, #1a1a1a, #000); 
            padding: 25px 0; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        header h1 { 
            margin: 0; 
            font-size: 2.5rem; 
            background: linear-gradient(90deg, #ff00cc, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 24px; 
        }
        .video-card { 
            background: #161616; 
            border-radius: 16px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: all 0.4s ease; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .video-card:hover { 
            transform: translateY(-12px); 
            box-shadow: 0 20px 30px rgba(255, 50, 50, 0.3);
        }
        .video-card img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
        }
        .video-info { 
            padding: 16px; 
        }
        .video-info h3 { 
            margin: 0 0 10px 0; 
            font-size: 15.5px; 
            line-height: 1.4; 
            font-weight: 500;
        }
        .duration { 
            position: absolute; 
            bottom: 12px; 
            right: 12px; 
            background: rgba(0,0,0,0.85); 
            color: #fff; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 13px; 
            font-weight: 600;
        }
        .card-wrapper { position: relative; }
    </style>
</head>
<body>
    <header>
        <h1>🔥 Video Hub</h1>
    </header>

    <div class="container">
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script>
        const API_BASE = "https://xhamster-video-proxy.onrender.com";

        async function loadVideos() {
            try {
                const res = await fetch(`${API_BASE}/api/videos`);
                const data = await res.json();
                
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';

                data.videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="card-wrapper">
                            <img src="${video.thumbnail}" alt="${video.title}" onerror="this.src='https://via.placeholder.com/320x200?text=Video'">
                            <span class="duration">${video.duration}</span>
                        </div>
                        <div class="video-info">
                            <h3>${video.title}</h3>
                        </div>
                    `;
                    card.onclick = () => {
                        window.location.href = `player.html?url=${encodeURIComponent(video.videoPageUrl)}`;
                    };
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('videoGrid').innerHTML = `<p style="color:#ff6666;text-align:center;padding:50px;">Videos load nahi ho rahe.<br>Refresh karo ya baad mein try karo.</p>`;
            }
        }

        window.onload = loadVideos;
    </script>
</body>
</html>
